<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111522" />
    <meta name="description" content="Kontoret, ett spelbart pixelkonstäventyr om första dagen som chef." />
    <title>Kontoret</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="app" aria-label="Kontoret">
      <section id="game-shell" aria-label="Kontoret">
        <div id="game-root" aria-hidden="true"></div>

        <div class="topbar">
          <span class="topbar__label">KONTORET<b id="player-label" hidden></b></span>
          <button id="sound-toggle" class="icon-button" type="button" aria-pressed="false" aria-label="Slå på ljud">
            <span aria-hidden="true" class="sound-icon">LJUD AV</span>
          </button>
        </div>

        <section id="intro" class="intro" aria-labelledby="intro-title">
          <div class="intro__shade"></div>
          <div class="intro__panel">
            <p class="intro__stamp">08:03 · FÖRSTA DAGEN</p>
            <h1 id="intro-title">KONTORET</h1>
            <p class="intro__lede">Välj chef. Ange namn. Försök se ut som om du fått en överlämning.</p>

            <fieldset class="avatar-picker">
              <legend>Välj chef</legend>
              <button class="avatar-card is-selected" type="button" data-avatar="avatar-a" aria-pressed="true">
                <span class="avatar-card__portrait avatar-card__portrait--a" aria-hidden="true"></span>
                <span>Chef 01</span>
              </button>
              <button class="avatar-card" type="button" data-avatar="avatar-b" aria-pressed="false">
                <span class="avatar-card__portrait avatar-card__portrait--b" aria-hidden="true"></span>
                <span>Chef 02</span>
              </button>
            </fieldset>

            <label class="name-field">
              <span>Namnskylt</span>
              <input id="player-name" maxlength="18" value="Alex" autocomplete="off" />
            </label>

            <button id="start-button" class="primary-button" type="button" disabled>LADDAR KONTORET…</button>
            <p id="load-status" class="intro__credit" role="status">Hämtar nycklarna. Och 2,4 MB pärmar.</p>
          </div>
        </section>

        <div id="hint" class="hint" role="status" aria-live="polite"></div>
        <div id="tooltip" class="tooltip" role="tooltip"></div>

        <section id="dialogue" class="dialogue" role="dialog" aria-modal="true" aria-labelledby="speaker-name" hidden>
          <div id="speaker-portrait" class="dialogue__portrait" aria-hidden="true"></div>
          <div class="dialogue__body">
            <h2 id="speaker-name"></h2>
            <p class="dialogue__line"><span id="speaker-line" aria-hidden="true"></span><span id="speaker-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></span></p>
            <div id="dialogue-choices" class="dialogue__choices" role="group" aria-label="Svarsalternativ"></div>
            <button id="dialogue-close" class="dialogue__continue" type="button" hidden>Fortsätt <span aria-hidden="true">→</span></button>
          </div>
        </section>

        <p id="scene-summary" class="sr-only" tabindex="-1" hidden>Kontoret är öppet. Fyra kollegor arbetar i ett stort kontorslandskap. Tryck Tab för att välja någon att prata med eller något att undersöka.</p>
        <nav id="hotspot-controls" class="hotspot-controls" aria-label="Saker på kontoret" hidden>
          <button type="button" data-hotspot="liv">Prata med Liv</button>
          <button type="button" data-hotspot="nadja">Prata med Nadja</button>
          <button type="button" data-hotspot="goran">Titta på Göran</button>
          <button type="button" data-hotspot="mira">Titta på Mira</button>
          <button type="button" data-hotspot="clock">Titta på klockan</button>
          <button type="button" data-hotspot="coffee">Titta på kaffemaskinen</button>
          <button type="button" data-hotspot="posters">Titta på affischerna</button>
        </nav>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
